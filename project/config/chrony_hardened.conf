# chrony_hardened.conf - STEALTH: Offline-mode chrony for orchestrator
# v5.0+: Date.now() drift detection. Real users have ms-level NTP sync.
# Containers often have ms-level drift from host. chrony provides a
# stable monotonic clock source.
#
# R7-ENT-002: The previous config had `pool time.cloudflare.com` and
# `pool pool.ntp.org` which sent NTP requests with the container's
# source IP. NTP servers log source IPs, leaking the container's
# WAN egress. We now use chrony's offline mode (`local stratum 10`)
# which provides a stable clock without any network egress. For
# real NTP sync, see the comment at the bottom.

# Offline mode: provide a stable clock without any external sync.
# The system clock is anchored at container start, with drift bounded
# by the kernel's oscillator stability (~100ppm = ~360ms/hour).
# This is more than adequate for a 45-minute persona session.
local stratum 10
manual
rtcsync

# Record the rate at which the system clock gains/loses time
driftfile /var/lib/chrony/chrony.drift

# Step the clock by up to 1 second on the first 3 updates (recovery
# from large jumps). After that, only slew the clock (gradual adjustment).
makestep 1.0 3

# Specify directory for log files.
logdir /var/log/chrony

# Log settings. We disable 'measurements' to reduce log volume.
log tracking

# ============================================================================
# OPTIONAL: Real NTP sync via DoH-resolved NTP servers
# ============================================================================
# If you need true ms-level NTP sync (e.g., for long-running sessions
# that exceed the kernel's oscillator stability), uncomment the
# following lines. The orchestrator's egress IP would still leak to
# the NTP servers, so use a low-trust NTP pool.
#
# Note: NTP over IPv4 (default). IPv6 is disabled by Phase 11.0.
# Note: time.cloudflare.com is preferred over pool.ntp.org because
# Cloudflare's anycast network has lower variance and is a more
# reliable single source. But Cloudflare logs source IPs.
#
# pool time.cloudflare.com iburst maxsources 2
# pool pool.ntp.org iburst maxsources 2
# minsources 2
# ============================================================================
