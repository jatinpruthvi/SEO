# sysctl_hardened.conf v6.0+ - Debian 12 / Linux 6.1.x Kernel Profile
#
# v6.0+ CRITICAL CHANGES (was v5.0+ Windows-mimic, now Debian defaults):
# - The host is Debian 12 (Linux). The host kernel should look like Linux.
# - The persona (Windows 10/11) is spoofed at the browser level by
#   CloakBrowser's C++ layer + prototype_hardener.js.
# - See hardened_host_os.sh v6.0.1 for the authoritative host sysctl config.
# - This file is a simplified version loaded by docker-compose.yml.
#
# IMPORTANT: This file configures the HOST (Debian 12) kernel, NOT the
# persona's claimed OS. The persona (Windows 10/11) is spoofed at the
# browser level.

# ----- TCP Window / Buffer (Debian 12 defaults) -----
net.core.rmem_max = 212992
net.core.wmem_max = 212992
net.ipv4.tcp_rmem = 4096 87380 6291456
net.ipv4.tcp_wmem = 4096 16384 4194304

# ----- TCP Window Scale (Debian 12 default: 1) -----
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_adv_win_scale = 1

# ----- TCP MSS / MTU Probing (Debian 12 default) -----
net.ipv4.tcp_mtu_probing = 0
net.ipv4.tcp_base_mss = 1024

# ----- TCP Slow Start (Debian 12 default: 1) -----
net.ipv4.tcp_slow_start_after_idle = 1

# ----- TCP Metrics (Debian 12 default) -----
net.ipv4.tcp_no_metrics_save = 0

# ----- TCP ECN (CHAMELEON: disabled — Debian 12 default is 1, but we
# disable to prevent OS-specific negotiation patterns. Windows
# personas would have ECN on, but the underlying Linux kernel
# was revealing its fingerprint.) -----
net.ipv4.tcp_ecn = 0

# ----- TCP Timestamps (CHAMELEON: disabled — eliminates uptime /
# clock skew leaks. Anti-bot p0f can identify host uptime from
# TCP timestamp values.) -----
net.ipv4.tcp_timestamps = 0

# ----- TCP SACK / DSACK / FACK (Debian 12 defaults) -----
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.tcp_fack = 1

# ----- TCP TIME_WAIT / Tw_reuse (Debian 12 defaults) -----
net.ipv4.tcp_tw_reuse = 2
net.ipv4.tcp_max_tw_buckets = 32768

# ----- TCP F-RTO (Debian 12 default: 0) -----
net.ipv4.tcp_frto = 0

# ----- TCP Reordering / App Win / Low Latency (Debian 12 defaults) -----
net.ipv4.tcp_reordering = 3
net.ipv4.tcp_app_win = 31
net.ipv4.tcp_low_latency = 0

# ----- TCP Retries (Debian 12 defaults) -----
net.ipv4.tcp_syn_retries = 6
net.ipv4.tcp_synack_retries = 5
net.ipv4.tcp_orphan_retries = 0
net.ipv4.tcp_retries2 = 15
net.ipv4.tcp_fin_timeout = 60

# ----- TCP Delayed ACK segments (Debian 12 default) -----
net.ipv4.tcp_delack_seg = 0

# ----- TCP Fast Open (Debian 12 default: 1) -----
net.ipv4.tcp_fastopen = 1
net.ipv4.tcp_fastopen_blackhole_timeout_sec = 0

# ----- TCP Pacing ratios (Debian 12 defaults) -----
net.ipv4.tcp_pacing_ss_ratio = 200
net.ipv4.tcp_pacing_ca_ratio = 120

# ----- TCP Workaround Signed Windows (Debian 12 default) -----
net.ipv4.tcp_workaround_signed_windows = 0

# ----- TCP Initial Congestion Window (Debian 12 default) -----
net.ipv4.tcp_init_cwnd = 10

# ----- TCP Keep-Alive (Debian 12 defaults) -----
net.ipv4.tcp_keepalive_time = 7200
net.ipv4.tcp_keepalive_intvl = 75
net.ipv4.tcp_keepalive_probes = 9

# ----- TCP SYN backlog (Debian 12 defaults) -----
net.ipv4.tcp_max_syn_backlog = 4096
net.core.somaxconn = 4096

# ----- Ephemeral Port Range (Debian 12 default) -----
net.ipv4.ip_local_port_range = 32768 60999

# ----- Default TTL (Debian 12 default: 64) -----
net.ipv4.ip_default_ttl = 64

# ----- Path MTU Discovery (Debian 12 default) -----
net.ipv4.ip_no_pmtu_disc = 0
net.ipv4.tcp_early_demux = 1

# ----- Source Routing / Redirects (security) -----
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# ----- Reverse Path Filtering (Debian 12 default: 1) -----
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ----- Martian Logging (Debian 12 default: 0) -----
net.ipv4.conf.all.log_martians = 0
net.ipv4.icmp_echo_ignore_all = 0
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ----- RSS / RPS (Debian 12 defaults) -----
net.core.rps_sock_flow_entries = 32768
net.core.rps_flow_cnt = 32768

# ----- busy_poll (Debian 12 defaults: 0) -----
net.core.busy_poll = 0
net.core.busy_read = 0
net.core.busy_poll_usecs = 0

# ----- conntrack (Debian 12 defaults scaled for 1 persona) -----
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_buckets = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 432000
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 120
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 60
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 120
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 120
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 60

# ----- Kernel Hardening (security — doesn't change TCP signature) -----
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 1
kernel.unprivileged_bpf_disabled = 1
kernel.randomize_va_space = 2
kernel.printk = 4 4 1 7
kernel.perf_cpu_time_max_percent = 1
kernel.perf_event_max_sample_rate = 1000
kernel.perf_event_paranoid = 2
kernel.panic = 30
kernel.yama.ptrace_scope = 1
kernel.unprivileged_userns_clone = 1

# ----- Virtual Memory (Debian 12 defaults for a server) -----
vm.swappiness = 10
vm.dirty_background_ratio = 10
vm.dirty_ratio = 20
vm.erase_memory_on_free = 1

# ----- File System (Debian 12 defaults) -----
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
